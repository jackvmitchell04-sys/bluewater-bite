name: Probe sources
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs to probe (space separated); blank = defaults"
        required: false
        default: ""
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests numpy netCDF4
      - run: python scripts/probe.py ${{ inputs.urls }}
