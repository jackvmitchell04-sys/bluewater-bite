name: Morning ocean data

on:
  schedule:
    - cron: "37 15 * * *"   # about 4:37am NZDT
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install xarray netCDF4 siphon numpy requests
      - run: python scripts/fetch_data.py
        env:
          MOANA_URL: ${{ secrets.MOANA_URL }}
      - name: Save new data
        run: |
          git config user.name "bluewater-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Morning data $(date -u +%Y-%m-%d)"
          git push
