name: Morning ocean data

on:
  schedule:
    - cron: "37 14 * * *"   # about 3:37am NZDT; GitHub often starts scheduled runs 30-80 min late, so data is ready by ~5am
    - cron: "37 23 * * *"   # about 12:37pm NZDT: picks up the day's new MUR, colour and model runs
  workflow_dispatch:         # lets you run it by hand from the Actions tab
    inputs:
      jobs:
        description: "Only these steps (e.g. ocean alerts); blank = everything"
        required: false
        default: ""

concurrency:
  group: data-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4          # raw VIIRS passes already gridded on earlier runs
        with:
          path: .cache/l2p
          key: l2p-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: l2p-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install xarray netCDF4 siphon numpy requests pillow tifffile imagecodecs
      - run: timeout 45m python scripts/fetch_data.py ${{ inputs.jobs }} || echo "fetch ended early, saving what finished"
      - name: Save new data
        if: always()
        run: |
          git config user.name "bluewater-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Morning data $(date -u +%Y-%m-%d)"
          # another data job may have pushed meanwhile: keep this run's files on conflict, retry a few times
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q || { git rebase --abort 2>/dev/null; git pull --no-rebase -X ours -q --no-edit; }
            git push && break
            sleep $((i*7))
          done
