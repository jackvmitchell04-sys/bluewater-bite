name: Hourly satellite refresh

on:
  schedule:
    - cron: "7 15-23,0-7 * * *"   # hourly 4am to 8pm NZDT: new Himawari scans, MUR, chlorophyll passes, altimetry (NOAA only, no Open-Meteo)
  workflow_dispatch: {}

concurrency:
  group: data-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  himawari:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install xarray netCDF4 siphon numpy requests pillow tifffile imagecodecs
      - run: timeout 15m python scripts/fetch_data.py himawari ocean alerts || echo "ended early"
      - name: Save
        if: always()
        run: |
          git config user.name "bluewater-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/himawari.json
          git diff --cached --quiet || git commit -m "Hourly SST $(date -u +%H:%M)"
          # another data job may have pushed meanwhile: keep this run's files on conflict, retry a few times
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q || { git rebase --abort 2>/dev/null; git pull --no-rebase -X ours -q --no-edit; }
            git push && break
            sleep $((i*7))
          done
