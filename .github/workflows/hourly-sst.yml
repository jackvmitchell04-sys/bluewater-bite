name: Hourly satellite refresh

on:
  schedule:
    - cron: "7 15-23,0-7 * * *"   # hourly 4am to 8pm NZDT: new Himawari scans, MUR, chlorophyll passes, altimetry (NOAA only, no Open-Meteo)
  workflow_dispatch: {}

concurrency:
  group: data-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  himawari:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4          # raw VIIRS passes and 750 m colour cut-outs from earlier runs
        with:
          path: .cache
          key: l2p-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: l2p-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install xarray netCDF4 siphon numpy requests pillow tifffile imagecodecs
      - run: timeout 20m python scripts/fetch_data.py himawari ocean alerts sharp truecolour openmeteo_catchup verify || echo "ended early"
        env:
          EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
          EARTHDATA_PASS: ${{ secrets.EARTHDATA_PASS }}
      - name: Save
        if: always()
        run: |
          git config user.name "bluewater-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Hourly data $(date -u +%H:%M)"
          # another data job may have pushed meanwhile: keep this run's files on conflict, retry a few times
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q || { git rebase --abort 2>/dev/null; git pull --no-rebase -X ours -q --no-edit; }
            git push && break
            sleep $((i*7))
          done
